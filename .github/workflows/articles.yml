name: Articles à la une

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions
  push:
    paths:
      - medias.json         # un média ajouté depuis le back office : ses articles arrivent tout de suite

permissions:
  contents: write

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les flux RSS
        run: python scripts/fetch_articles.py
      - name: Enregistrer les nouveaux articles
        run: |
          if git diff --quiet -- articles.json; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git commit -m "chore: mise à jour des articles à la une"
          git push
